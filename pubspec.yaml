name: lecture_vault
description: 上課錄音即時轉文字與重點萃取
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  file_picker: ^8.1.2
  characters: ^1.4.0
  dart_sentencepiece_tokenizer: ^1.3.2
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  google_sign_in: ^6.3.0
  googleapis: ^14.0.0
  http: ^1.2.2
  flutter_riverpod: ^3.3.1
  fcllama: ^0.0.3
  onnxruntime: ^1.4.1
  path: ^1.9.0
  path_provider: ^2.1.2
  record: ^5.1.0
  sqflite: ^2.3.0
  whisper_ggml_plus: ^1.5.2
  audioplayers: ^5.2.1
  wakelock_plus: ^1.2.8
  ffmpeg_kit_min_gpl: ^6.0.3+2-LTS

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  wakelock_plus_platform_interface: ^1.5.0
  sqflite_common_ffi: ^2.3.0+1

flutter:
  uses-material-design: true
  assets:
    # Whisper 模型目錄；大型 .bin 檔案可放在此目錄供本機開發/發版打包。
    - assets/models/whisper/
    - assets/models/minilm/
    - assets/models/llm/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.otf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Bold.ttf
          weight: 700

dependency_overrides:
  record_linux: ^1.3.0
